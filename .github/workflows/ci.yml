name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  virtual-desktop-probe:
    name: Virtual desktop probe (automated only)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build and run automated checks
        shell: pwsh
        run: ./spikes/VirtualDesktop/run.ps1 test
