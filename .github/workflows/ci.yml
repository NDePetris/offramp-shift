name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  core-monitoring:
    name: Core, persistence and Windows app (synthetic observations, local SQLite)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build and run core and persistence checks
        shell: pwsh
        run: ./run.ps1 test

      - name: Verify core and persistence formatting
        shell: pwsh
        run: ./run.ps1 format

  virtual-desktop-probe:
    name: Virtual desktop probe (automated only)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build and run automated checks
        shell: pwsh
        run: ./spikes/VirtualDesktop/run.ps1 test

  browser-attribution-probe:
    name: Browser attribution probe (synthetic and mocked only)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # No registry installation, browser interaction or desktop switching.
      # Native transport uses disposable synthetic callers on this isolated runner.
      - name: Build and run automated browser-probe checks
        shell: pwsh
        run: |
          $env:DOTNET_ROOT = Split-Path (Get-Command dotnet).Source -Parent
          ./spikes/BrowserAttribution/run.ps1 test

  windows-observation-probe:
    name: Windows observation probe (synthetic only)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Deterministic tests and formatting only; no live commands or desktop COM.
      - name: Build and run synthetic observation tests
        shell: pwsh
        run: ./spikes/WindowsObservation/run.ps1 test

      - name: Verify observation probe formatting
        shell: pwsh
        run: ./spikes/WindowsObservation/run.ps1 format
